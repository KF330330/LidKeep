}.menu-art{flex-direction:column;gap:17px}.tiny-strip{display:flex;align-items:center;justify-content:center;gap:15px;color:var(--muted);background:var(--surface);height:27px;padding:0 14px;border-radius:7px;border:1px solid var(--line);font-size:10px}.tiny-strip .sample-menu{height:18px;width:18px}.tiny-strip svg{width:15px;height:15px}.preview{position:sticky;top:24px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:23px}.preview-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:10px;letter-spacing:1.2px;color:var(--muted)}.preview-top strong{font-size:10px;background:var(--wash);color:var(--accent);border-radius:6px;padding:5px 7px;font-weight:500;letter-spacing:0}.hero-art{display:flex;align-items:center;justify-content:center;height:229px;border-radius:14px;background:var(--card)}.hero-art .app-image{height:198px;width:198px;filter:drop-shadow(0 14px 12px #09241b25)}.hero-art .menu-image{height:88px;width:88px}.selected-heading{display:flex;gap:10px;align-items:center;margin:24px 0 9px}.selected-heading h2{font-size:23px;font-weight:550;letter-spacing:-.6px;margin:0}.description{font-size:12px;line-height:1.8;color:var(--muted);min-height:44px;margin:0 0 23px}.sizes-label{font-size:10px;letter-spacing:1px;color:var(--muted);margin-bottom:15px}.sizes{display:flex;align-items:flex-end;justify-content:space-around;border-bottom:1px solid var(--line);padding:3px 0 21px;margin-bottom:20px}.size-sample{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}.size-sample small{font-family:ui-monospace,monospace;font-size:9px;color:var(--muted)}.menu-context{margin:10px 0 20px}.mac-bar{height:34px;border:1px solid #d6d8d3;border-radius:9px;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0 10px;background:#f0f2ed;color:#171b1b;font-size:10px;margin-bottom:8px}.mac-bar.night{background:#282d2b;border-color:#383d3b;color:#f3f7f3}.mac-bar svg{width:16px;height:16px}.mac-bar img{height:18px;width:18px}.mac-bar.night img{filter:invert(1)}.footnote{font-size:10px;color:var(--muted);line-height:1.6;margin:9px 0 0}.choose{width:100%;border:0;border-radius:10px;background:var(--accent);color:var(--surface);padding:13px;font-size:12px;font-weight:600}.download{display:block;text-align:center;font-size:11px;margin-top:14px;text-decoration:none;color:var(--muted)}.download:hover{color:var(--ink)}.feedback{font-size:11px;line-height:1.7;color:var(--accent);margin:15px 0 0;min-height:19px}.bottom{display:flex;justify-content:space-between;gap:24px;padding:23px 0 35px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.shortlist{color:var(--ink)}.bottom a{text-underline-offset:4px}.hidden{display:none!important}@media(min-width:1550px){.art{height:184px}.app-image{width:124px;height:124px}}@media(max-width:1150px){.shell{padding:0 28px}.layout{grid-template-columns:minmax(0,1fr) 272px;gap:20px}.grid{gap:12px}.art{height:145px}.app-image{width:104px;height:104px}.card .english{display:none}.preview{padding:18px}.hero-art{height:211px}.hero-art .app-image{width:181px;height:181px}}@media(max-width:920px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hint{display:none}.collection{display:none}}@media(max-width:620px){.shell{padding:0 20px}.top{height:77px}.brand span{display:none}.intro{padding:33px 0 21px}.intro h1{font-size:29px;letter-spacing:-1px}.intro p{font-size:12px}.layout{grid-template-columns:1fr}.preview{position:static;max-width:420px;width:100%;margin:auto}.art{height:147px}.card-meta{padding:14px 11px;gap:7px}.card h2{font-size:13px}.tab{font-size:13px}.tabs{gap:22px}.bottom{flex-direction:column;gap:13px}.theme button{padding:7px 10px}.hero-art{height:220px}.tiny-strip{gap:10px;padding:0 10px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

<section class="intro">
<div><div class="eyebrow">ROUND 02 · A13—A24</div><h1>更简洁，也更有辨识度。</h1><p>全新 12 款应用图标：少一点装饰，多一点清晰的轮廓。<br>菜单栏保留上一轮方案。<a href="round-1.html" target="_blank" rel="noopener" style="text-underline-offset:3px">对比第一轮及其已选方案 ↗</a></p></div>

 118 75 112L53 97Q47 92 54 87Z\" fill=\"#315c52\"/>\n<path d=\"M54 111L78 128Q85 133 95 130L197 100V120L95 151Q85 154 78 149L54 132Z\" fill=\"#87a99a\"/>\n<path d=\"M54 150L78 167Q85 172 95 169L197 139V159L95 190Q85 193 78 188L54 171Z\" fill=\"#315c52\"/>\n</svg>\n"}, {"id": "A17", "name": "潮汐", "english": "TIDAL", "description": "两道宽阔的波形，表达不断流动的任务。只用两种深浅蓝，强调柔和的节奏感。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" fill=\"none\">\n<rect x=\"8\" y=\"8\" width=\"240\" height=\"240\" rx=\"54\" fill=\"#b9dedf\"/>\n<path d=\"M49 104C75 104 73 70 99 70C125 70 123 104 149 104C175 104 173 70 201 70\" stroke=\"#184558\" stroke-width=\"24\" stroke-linecap=\"round\"/>\n<path d=\"M49 175C75 175 73 141 99 141C125 141 123 175 149 175C175 175 173 141 201 141\" stroke=\"#347f8e\" stroke-width=\"24\" stroke-linecap=\"round\"/>\n</svg>\n"}, {"id": "A18", "name": "方寸", "english": "LETTER L", "description": "厚实的 L 与一个独立方块。金黄底色、清楚的负形，是最直接的字母标志方向。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" fill=\"none\">\n<rect x=\"8\" y=\"8\" width=\"240\" height=\"240\" rx=\"54\" fill=\"#f0c564\"/>\n<path d=\"M75 59H111V159H181V195H92Q75 195 75 178Z\" fill=\"#282d30\"/>\n<path d=\"M129 59H181V111H145Q129 111 129 95Z\" fill=\"#fbefc9\"/>\n</svg>\n"}, {"id": "A19", "name": "磁场", "english": "MAGNETIC", "description": "两枚相向的弧形互相承接，中央留白。淡橘和薰衣草色让整体更温和。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" fill=\"none\">\n<rect x=\"8\" y=\"8\" width=\"240\" height=\"240\" rx=\"54\" fill=\"#473d65\"/>\n<path d=\"M128 49C83 49 49 84 49 128C49 168 78 201 116 206V168C98 163 86 147 86 128C86 105 105 86 128 86H154V49Z\" fill=\"#e7c8b0\"/>\n<path d=\"M141 50V88C159 94 170 109 170 128C170 151 151 170 128 170H102V207H128C173 207 207 172 207 128C207 89 179 56 141 50Z\" fill=\"#c6b7ee\"/>\n</svg>\n"}, {"id": "A20", "name": "折线", "english": "FOLDLINE", "description": "相邻的折线朝同一方向延伸。米白与浅绿形成清晰主次，有简洁的工业设计感。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" fill=\"none\">\n<rect x=\"8\" y=\"8\" width=\"240\" height=\"240\" rx=\"54\" fill=\"#244c45\"/>\n<path d=\"M71 130L114 64Q118 58 126 58H150Q157 58 153 65L111 130L153 194Q157 201 149 201H125Q118 201 114 194Z\" fill=\"#e9f0cf\"/>\n<path d=\"M120 130L159 71Q164 63 171 72L199 118Q206 130 199 142L171 188Q166 196 160 188Z\" fill=\"#96ba90\"/>\n</svg>\n"}, {"id": "A21", "name": "隙光", "english": "LIGHT GAP", "description": "两层厚实横向胶囊之间，留一条橙色亮缝。只保留合盖与持续工作的核心意象。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" fill=\"none\">\n  <defs>\n    <linearGradient id=\"gap-bg\" x1=\"35\" y1=\"8\" x2=\"222\" y2=\"248\" gradientUnits=\"userSpaceOnUse\"><stop stop-color=\"#292C32\"/><stop offset=\"1\" stop-color=\"#171A20\"/></linearGradient>\n    <linearGradient id=\"gap-light\" x1=\"56\" y1=\"128\" x2=\"202\" y2=\"128\" gradientUnits=\"userSpaceOnUse\"><stop stop-color=\"#FFB569\"/><stop offset=\"1\" stop-color=\"#F57B43\"/></linearGradient>\n  </defs>\n  <rect x=\"8\" y=\"8\" width=\"240\" height=\"240\" rx=\"54\" fill=\"url(#gap-bg)\"/>\n  <rect x=\"43\" y=\"73\" width=\"157\" height=\"46\" rx=\"23\" fill=\"#FFF6E5\"/>\n  <rect x=\"56\" y=\"123\" width=\"144\" height=\"10\" rx=\"5\" fill=\"url(#gap-light)\"/>\n  <rect x=\"56\" y=\"137\" width=\"157\" height=\"46\" rx=\"23\" fill=\"#E8DECC\"/>\n</svg>\n"}, {"id": "A22", "name": "转子", "english": "ROTOR", "description": "三片宽叶片围绕中心转动。珊瑚橙大色块，单靠剪影就有持续运转的感觉。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" fill=\"none\">\n  <defs>\n    <linearGradient id=\"rotor-bg\" x1=\"28\" y1=\"8\" x2=\"222\" y2=\"248\" gradientUnits=\"userSpaceOnUse\">\n      <stop stop-color=\"#FFFDF7\"/><stop offset=\"1\" stop-color=\"#F0EADF\"/>\n    </linearGradient>\n  </defs>\n  <rect x=\"8\" y=\"8\" width=\"240\" height=\"240\" rx=\"54\" fill=\"url(#rotor-bg)\"/>\n  <path d=\"M118 114C95 116 74 100 67 82 61 66 70 53 84 52 106 50 126 73 135 100 138 109 132 116 124 115Z\" fill=\"#F57656\"/>\n  <path d=\"M118 114C95 116 74 100 67 82 61 66 70 53 84 52 106 50 126 73 135 100 138 109 132 116 124 115Z\" transform=\"rotate(120 128 128)\" fill=\"#EA664D\"/>\n  <path d=\"M118 114C95 116 74 100 67 82 61 66 70 53 84 52 106 50 126 73 135 100 138 109 132 116 124 115Z\" transform=\"rotate(240 128 128)\" fill=\"#DB5748\"/>\n</svg>\n"}, {"id": "A23", "name": "接续", "english": "HANDOFF", "description": "两条宽大的 J 形带互相扣合。双色区分两个任务，连成一个紧凑的整体。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" fill=\"none\">\n  <defs>\n    <linearGradient id=\"relay-bg\" x1=\"40\" y1=\"8\" x2=\"215\" y2=\"248\" gradientUnits=\"userSpaceOnUse\"><stop stop-color=\"#433550\"/><stop offset=\"1\" stop-color=\"#2B2338\"/></linearGradient>\n    <linearGradient id=\"relay-violet\" x1=\"71\" y1=\"176\" x2=\"118\" y2=\"53\" gradientUnits=\"userSpaceOnUse\"><stop stop-color=\"#B6A1DF\"/><stop offset=\"1\" stop-color=\"#E4D5FA\"/></linearGradient>\n    <linearGradient id=\"relay-peach\" x1=\"147\" y1=\"75\" x2=\"179\" y2=\"195\" gradientUnits=\"userSpaceOnUse\"><stop stop-color=\"#FFE1BC\"/><stop offset=\"1\" stop-color=\"#F3BD98\"/></linearGradient>\n  </defs>\n  <rect x=\"8\" y=\"8\" width=\"240\" height=\"240\" rx=\"54\" fill=\"url(#relay-bg)\"/>\n  <path d=\"M115 62v80c0 20-10 32-27 32s-27-12-27-30v-13\" stroke=\"url(#relay-violet)\" stroke-width=\"29\" stroke-linecap=\"round\"/>\n  <path d=\"M141 194v-80c0-20 10-32 27-32s27 12 27 30v13\" stroke=\"url(#relay-peach)\" stroke-width=\"29\" stroke-linecap=\"round\"/>\n</svg>\n"}, {"id": "A24", "name": "同频", "english": "IN SYNC", "description": "两根不同高度的圆头柱由横桥连接。冰蓝底上的深色实体，简洁、有结构感。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" fill=\"none\">\n  <defs>\n    <linearGradient id=\"sync-bg\" x1=\"30\" y1=\"8\" x2=\"220\" y2=\"248\" gradientUnits=\"userSpaceOnUse\"><stop stop-color=\"#F2FBFC\"/><stop offset=\"1\" stop-color=\"#CDE7ED\"/></linearGradient>\n    <linearGradient id=\"sync-mark\" x1=\"72\" y1=\"54\" x2=\"187\" y2=\"199\" gradientUnits=\"userSpaceOnUse\">\n      <stop stop-color=\"#244458\"/><stop offset=\"1\" stop-color=\"#122D43\"/>\n    </linearGradient>\n  </defs>\n  <rect x=\"8\" y=\"8\" width=\"240\" height=\"240\" rx=\"54\" fill=\"url(#sync-bg)\"/>\n  <path d=\"M63 76a20 20 0 0 1 40 0v35h50V91a20 20 0 0 1 40 0v89a20 20 0 0 1-40 0v-31h-50v24a20 20 0 0 1-40 0Z\" fill=\"url(#sync-mark)\"/>\n</svg>\n"}], "menu": [{"name": "合盖微光", "english": "LID", "description": "一条闭合电脑的轮廓，加一颗运行指示点。功能直观，最接近系统工具。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#171b1b\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M5 10.5h12l2.5 5H2.5z\"/>\n  <path d=\"M2.5 15.5v1a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-1M9.5 15.5h3\"/>\n  <circle cx=\"19.2\" cy=\"6.3\" r=\"1.7\" fill=\"#171b1b\" stroke=\"none\"/>\n</svg>\n"}, {"name": "折角", "english": "FOLD", "description": "用两条短线表达折叠的电脑。笔画少，菜单栏里非常安静。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#171b1b\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"m5.5 4.5 4 10.5h10l-4 4.5H5a1.5 1.5 0 0 1-1.5-1.5V6a1.5 1.5 0 0 1 2-1.5Z\"/>\n  <path d=\"M9.5 15 4 18.5\"/>\n</svg>\n"}, {"name": "无限", "english": "LOOP", "description": "持续循环的单一轮廓。没有设备细节，18px 下仍清楚。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#171b1b\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M12 12c-2.2-3.1-3.5-4.5-5.5-4.5a4.5 4.5 0 0 0 0 9c2 0 3.3-1.4 5.5-4.5s3.5-4.5 5.5-4.5a4.5 4.5 0 0 1 0 9c-2 0-3.3-1.4-5.5-4.5Z\"/>\n</svg>\n"}, {"name": "月弧", "english": "MOON", "description": "月亮与一点星光。表达屏幕熄灭时，后台仍在工作。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#171b1b\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M13.2 3.7a8.5 8.5 0 1 0 7.1 12.8 7.2 7.2 0 0 1-7.1-12.8Z\"/>\n  <circle cx=\"19\" cy=\"6.5\" r=\"1.5\" fill=\"#171b1b\" stroke=\"none\"/>\n</svg>\n"}, {"name": "守护", "english": "GUARD", "description": "盾牌里的一条合盖横线。强调安全保护，稳重且容易辨认。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#171b1b\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"m12 3-7.5 3v5.5c0 4.1 3 7.6 7.5 9.5 4.5-1.9 7.5-5.4 7.5-9.5V6Z\"/>\n  <path d=\"M8.5 11h7M8 14h8\"/>\n</svg>\n"}, {"name": "电源环", "english": "POWER", "description": "围绕持续运行的电源符号。熟悉、简洁，不需要额外状态文字。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#171b1b\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M7 5.7a8 8 0 1 0 10 0M12 3v8\"/>\n  <circle cx=\"12\" cy=\"14.5\" r=\"1.1\" fill=\"#171b1b\" stroke=\"none\"/>\n</svg>\n"}, {"name": "脉冲", "english": "PULSE", "description": "短促、稳定的心跳线。表达任务持续推进，适合开发者工具。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#171b1b\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M3 14h4V6h5v12h5v-8h4\"/>\n</svg>\n"}, {"name": "接力", "english": "RELAY", "description": "两个相接的圆环。对应两个 AI 工具接力工作。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#171b1b\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M11 8.6a5.3 5.3 0 1 0 0 6.8M13 8.6a5.3 5.3 0 1 1 0 6.8\"/>\n  <path d=\"M8.5 12h7\"/>\n</svg>\n"}, {"name": "眼眸", "english": "OWL", "description": "两只清醒的小眼睛。保留猫头鹰的识别点，缩到菜单栏也有个性。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#171b1b\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"m3 6 4.5 2.5L12 8l4.5.5L21 6v6a4.5 4.5 0 0 1-9 0 4.5 4.5 0 0 1-9 0Z\"/>\n  <path d=\"m10 17 2 2 2-2\"/>\n  <circle cx=\"7.5\" cy=\"12\" r=\"1.3\" fill=\"#171b1b\" stroke=\"none\"/>\n  <circle cx=\"16.5\" cy=\"12\" r=\"1.3\" fill=\"#171b1b\" stroke=\"none\"/>\n</svg>\n"}, {"name": "日出", "english": "DAWN", "description": "地平线上的一轮半圆。用最少笔画表现一直在线的状态。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#171b1b\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M3 17h18M6.5 17a5.5 5.5 0 0 1 11 0M12 4v3M4.5 8l2 2M19.5 8l-2 2\"/>\n  <path d=\"M7 20h10\"/>\n</svg>\n"}, {"name": "续航电池", "english": "BATTERY", "description": "一枚简洁电池与内部短线。侧重电量保护，也带有熟悉的系统感。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#171b1b\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <rect x=\"2.5\" y=\"6.5\" width=\"16.5\" height=\"11\" rx=\"2.5\"/>\n  <path d=\"M21.5 10v4M7 12h7\"/>\n</svg>\n"}, {"name": "轨道", "english": "ORBIT", "description": "一颗沿椭圆轨道运行的小点。轻盈、连续，图形独立且克制。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#171b1b\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M17.6 4.2C14.6 3 9.3 6.1 6 10.6s-4.1 8.9-1.7 10.1 7.3-1.5 10.7-6c1.9-2.5 3-5 3.2-7\"/>\n  <circle cx=\"18.5\" cy=\"4.5\" r=\"1.8\" fill=\"#171b1b\" stroke=\"none\"/>\n  <circle cx=\"11.5\" cy=\"12.5\" r=\"1.8\" fill=\"#171b1b\" stroke=\"none\"/>\n</svg>\n"}]};
let group = 'app';
const active = {app:0,menu:0};
const chosen = {app:null,menu:null};
const grid = document.getElementById('grid');
const wifi = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 9Q12 1 21 9M6.5 13Q12 8 17.5 13M10 17Q12 15 14 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>';
const battery = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M21 10V14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="4" y="9" width="11" height="6" rx="1" fill="currentColor"/></svg>';
const source = icon => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(icon.svg);
const label = (key, index) => collections[key][index].id || (key === 'app' ? 'A' : 'M') + String(index+1).padStart(2,'0');
function save(){try{localStorage.setItem('lidkeep-icon-lab-v2',JSON.stringify({active,chosen,theme:document.body.classList.contains('dark')?'dark':'light'}));}catch{}}
function shortlist(){
  document.getElementById('shortlist').textContent = ['app','menu'].filter(key => chosen[key] !== null).map(key => label(key,chosen[key])+' '+collections[key][chosen[key]].name).join(' ＋ ') || '尚未选择';
}
function showPreview(){
  const index = active[group], icon = collections[group][index], uri = source(icon), isMenu = group === 'menu';
  const hero = document.getElementById('hero');
  hero.src = uri; hero.alt = label(group,index)+' '+icon.name; hero.className = isMenu?'menu-image':'app-image';
  document.getElementById('format-label').textContent = isMenu?'MENU BAR / TEMPLATE':'APP ICON';
  document.getElementById('selected-number').textContent = label(group,index);
  document.getElementById('selected-name').textContent = icon.name;
  document.getElementById('description').textContent = icon.description;
  document.getElementById('sizes').innerHTML = (isMenu?[24,18,16]:[64,32,16]).map(size=>`<div class="size-sample"><img src="${uri}" alt="${size} 像素预览" class="${isMenu?'sample-menu':''}" width="${size}" height="${size}"><small>${size}px</small></div>`).join('');
  document.getElementById('menu-context').classList.toggle('hidden',!isMenu);
  document.getElementById('bars').innerHTML = ['','night'].map(style=>`<div class="mac-bar ${style}" aria-label="${style?'深色':'浅色'}菜单栏预览"><img src="${uri}" alt="所选菜单栏图标">${wifi}${battery}<span>周三 10:24</span></div>`).join('');
  document.getElementById('choose').textContent = chosen[group] === index?'已选 '+label(group,index)+' · 点击可取消':'选定这个'+(isMenu?'菜单栏':'应用')+'图标';
  const download = document.getElementById('download'); download.href = uri; download.download = 'LidKeep-'+label(group,index)+'-'+icon.name+'.svg';
  document.getElementById('feedback').textContent = chosen[group] === index?'已加入搭配，选好两组后把编号告诉我。':'';
  grid.querySelectorAll('.card').forEach((card,i)=>card.setAttribute('aria-pressed',String(i===index)));
}
function render(){
  const isMenu = group === 'menu';
  grid.setAttribute('aria-label',isMenu?'菜单栏图标方案':'应用图标方案');
  document.getElementById('group-hint').textContent = isMenu?'单色模板 · 18px 图形 · 不带状态文字':'独立配色 · 原生矢量 · 小尺寸预览';
  document.querySelectorAll('[data-group]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.group===group)));
  grid.innerHTML = collections[group].map((icon,index)=>`<button type="button" class="card" data-index="${index}" aria-label="预览 ${label(group,index)} ${icon.name}" aria-pressed="${index===active[group]}"><span class="tick" aria-hidden="true">✓</span><div class="art ${isMenu?'menu-art':''}"><img class="${isMenu?'menu-image':'app-image'}" src="${source(icon)}" alt="">${isMenu?`<div class="tiny-strip" aria-hidden="true"><img class="sample-menu" src="${source(icon)}" alt="">${wifi}<span>10:24</span></div>`:''}</div><div class="card-meta"><span class="number">${label(group,index)}</span><h2>${icon.name}</h2><span class="english">${icon.english}</span></div></button>`).join('');
  showPreview();
}
function setTheme(theme){document.body.classList.toggle('dark',theme==='dark');document.querySelectorAll('[data-theme]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.theme===theme)));save();}
grid.addEventListener('click',event=>{const card=event.target.closest('.card');if(!card)return;active[group]=Number(card.dataset.index);showPreview();save();});
document.querySelectorAll('[data-group]').forEach(button=>button.addEventListener('click',()=>{group=button.dataset.group;render();}));
document.querySelectorAll('[data-theme]').forEach(button=>button.addEventListener('click',()=>setTheme(button.dataset.theme)));
document.getElementById('choose').addEventListener('click',()=>{chosen[group]=chosen[group]===active[group]?null:active[group];showPreview();shortlist();save();});
try{
  const stored=JSON.parse(localStorage.getItem('lidkeep-icon-lab-v2')||'null');
  if(stored){for(const key of ['app','menu']){if(Number.isInteger(stored.active?.[key])&&stored.active[key]>=0&&stored.active[key]<12)active[key]=stored.active[key];if(Number.isInteger(stored.chosen?.[key])&&stored.chosen[key]>=0&&stored.chosen[key]<12)chosen[key]=stored.chosen[key];}setTheme(stored.theme==='dark'?'dark':'light');}
}catch{}
render();shortlist();
</script>
